[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "session-agent-runtime"
version = "0.1.0"
description = "A component-loading factory built on LangChain create_agent"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.15",
    "langgraph==1.2.11",
]

[project.optional-dependencies]
chat = ["langchain-openai>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = [
    "agent_factory", "agent_factory.*", "config",
    "tools", "tools.*", "middleware", "middleware.*", "skills", "skills.*",
]

[tool.setuptools.package-data]
config = ["agents/*/config.toml", "agents/*/SOUL.md"]
skills = ["*/SKILL.md"]
