[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "session-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langchain==1.3.15","langgraph==1.2.11","langgraph-checkpoint-sqlite==3.1.3","filelock>=3.16,<5"]

[project.optional-dependencies]
chat = ["langchain-openai>=1,<2", "httpx[socks]>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["agent_runtime"]
